<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相机控制系统 - 完整流程模拟</title>
    <!-- 引入基础样式 -->
    <link rel="stylesheet" href="src/css/base.css">
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/camera-view.css">
    
    <!-- 引入组件样式 -->
    <link rel="stylesheet" href="src/css/components/buttons.css">
    <link rel="stylesheet" href="src/css/components/form-controls.css">
    <link rel="stylesheet" href="src/css/components/notifications.css">
    <link rel="stylesheet" href="src/css/components/tabs.css">
    <link rel="stylesheet" href="src/css/components/panels.css">
    
    <!-- 引入功能样式 -->
    <link rel="stylesheet" href="src/css/features/axis-config.css">
    <link rel="stylesheet" href="src/css/features/focus-controls.css">
    <link rel="stylesheet" href="src/css/features/calibration.css">
    
    <!-- 字体图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.png" type="image/png">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-controls">
                <button class="header-button" id="btn-play" title="连续采集"><i class="fas fa-play"></i></button>
                <button class="header-button" id="btn-stop" title="停止采集" disabled=""><i class="fas fa-stop"></i></button>
                <button class="header-button" id="btn-capture" title="单张拍照"><i class="fas fa-camera"></i></button>
                <button class="header-button" id="btn-record" title="开始录制"><i class="fas fa-video"></i></button>
                <button class="header-button" id="btn-trigger" title="软件触发"><i class="fas fa-bolt"></i></button>
                <button class="header-button" id="btn-settings" title="设置"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <main class="main-content">
            <section class="camera-view">
                <!-- 用户提示区域 -->
                <div class="help-tips">
                    <div class="tips-title">操作指南：</div>
                    <div class="tips-content">
                        <ul>
                            <li>绘制ROI：请点击"绘制"按钮，然后在图像上按住鼠标左键拖动绘制矩形区域</li>
                            <li>完成绘制后可以：确认、重绘或清除ROI区域</li>
                            <li>校准ROI：请先显示标定板，再进行校准区域绘制</li>
                        </ul>
                    </div>
                </div>
                
                <!-- Moved Toggle Button Here -->
                <button id="toggle-view-btn" class="select-button" disabled="" style="position: absolute; z-index: 10;"><i class="fas fa-sync-alt"></i> 显示标定板</button>

                <!-- Container for image/svg -->
                <div id="camera-display-container">
                    <img id="simulated-image" src="/favicon.png" alt="模拟相机图像">
                    <div id="calibration-pattern-display" style="display: none; width: 100%; height: 100%;">
                        <!-- SVG will be injected here by JS -->
                    </div>
                    <!-- Focus ROI Overlay (Original) -->
                    <div class="focus-overlay" id="focus-roi-overlay" style="display: none;"></div>
                    <!-- Calibration ROI Overlay (New) -->
                    <div class="focus-overlay calibration-roi-overlay" id="calibration-roi-overlay" style="display: none;"></div>
                </div>
            </section>
        </main>

        <!-- Move control-panel outside main-content -->
        <aside class="control-panel" id="control-panel-content">
             <!-- Camera Info Section -->
             <div class="panel-section requires-connection">
                 <h3>相机操作</h3>
                 <!-- Moved Camera Name and Model Up -->
                 <div class="control-item">
                     <label for="camera-name">相机名称：</label>
                     <input type="text" id="camera-name" value="" disabled="">
                 </div>
                 <div class="control-item">
                     <label for="camera-model">相机型号：</label>
                     <input type="text" id="camera-model" value="" readonly="" disabled="">
                 </div>
                  <!-- Original Config File and Save Path -->
                 <div class="control-item">
                     <label for="config-file">配置文件：</label>
                      <div class="input-group">
                         <input type="text" id="config-file" value="" readonly placeholder="未选择文件" disabled="">
                         <button id="select-config-btn" class="select-button mini-button" disabled="">选择</button>
                     </div>
                 </div>
                  <div class="control-item">
                     <label for="save-path">图像保存路径：</label>
                      <div class="input-group">
                         <input type="text" id="save-path" value="" readonly placeholder="连接后显示" disabled="">
                         <button id="select-folder-btn" class="select-button mini-button" disabled="">选择</button>
                     </div>
                 </div>
             </div>
             <!-- End Camera Info Section -->

            <!-- Camera Properties & Controls -->
            <div class="panel-section requires-connection">
                <h3>相机属性与控制</h3>
                <!-- Ensure all items follow label-left, control-right -->
                <div class="control-item">
                    <label>Y反转:</label>
                    <select><option>否</option><option>是</option></select>
                </div>
                <div class="control-item">
                    <label>X反转:</label>
                    <select><option>否</option><option>是</option></select>
                </div>
                 <div class="control-item">
                    <label>触发模式:</label>
                    <select id="trigger-mode-select"><option value="连续采集">连续采集</option><option value="软件触发">软件触发</option><option>外部触发</option></select>
                </div>
                 <div class="control-item">
                    <label>触发信号:</label>
                    <select><option>上升沿</option><option>下降沿</option></select>
                </div>
                 <div class="control-item">
                    <label>触发源:</label>
                    <select><option>通道0</option><option>通道1</option><option>软件</option></select>
                </div>
                 <div class="control-item">
                    <label>图像格式:</label>
                    <select id="image-format-select"><option>MONO8</option><option>RGB8</option></select>
                </div>
                 <div class="control-item">
                    <label for="exposure-time">曝光时间(us):</label>
                    <input type="number" id="exposure-time" value="-1">
                </div>
                <div class="control-item">
                    <label for="gain">增益:</label>
                    <input type="number" id="gain" value="-1">
                </div>
                <div class="control-item toggle-item">
                    <label for="enable-camera-cb">使能:</label>
                    <label class="switch">
                        <input type="checkbox" id="enable-camera-cb">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="control-item toggle-item">
                    <label for="white-balance-cb">自动白平衡:</label>
                     <label class="switch">
                        <input type="checkbox" id="white-balance-cb">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="control-item range-item manual-wb-control" style="display: flex;">
                    <label>红(R):</label>
                    <div> <!-- Wrap range slider and value -->
                        <input type="range" id="wb-red" min="0" max="255" value="128">
                        <span class="range-value">(128)</span>
                    </div>
                </div>
                <div class="control-item range-item manual-wb-control" style="display: flex;">
                    <label>绿(G):</label>
                    <div>
                        <input type="range" id="wb-green" min="0" max="255" value="128">
                        <span class="range-value">(128)</span>
                    </div>
                </div>
                <div class="control-item range-item manual-wb-control" style="display: flex;">
                    <label>蓝(B):</label>
                    <div>
                         <input type="range" id="wb-blue" min="0" max="255" value="128">
                         <span class="range-value">(128)</span>
                    </div>
                </div>

                <hr class="separator">

                <!-- Z Axis / Focus -->
                <h4>Z轴控制 / 对焦</h4>
                <div class="control-item">
                    <label for="current-z">当前 Z (mm):</label>
                    <input type="text" id="current-z" value="--" readonly="">
                </div>
                <div class="control-item">
                    <label for="clarity-value">当前清晰度:</label>
                    <input type="text" id="clarity-value" value="--" readonly="">
                </div>
                <div class="control-item focus-status">
                    <label>对焦状态:</label>
                    <span id="focus-status-text" class="status-text status-错误">错误</span>
                </div>

                <!-- 添加移到拍照位按钮 -->
                <div class="control-item">
                    <button id="move-to-photo-pos-btn" class="photo-position-button"><i class="fas fa-camera-retro"></i> 移到拍照位</button>
                </div>

                <!-- Focus ROI Controls -->
                <div class="roi-header-line control-item">
                    <label>对焦ROI区域</label>
                    <div>
                        <button id="draw-roi-focus-btn" class="roi-button" style="display: inline-block;"><i class="fas fa-pencil-alt"></i> 绘制</button>
                        <div id="focus-roi-button-group" class="roi-button-group" style="display: none;">
                            <button id="confirm-roi-focus-btn" class="roi-button" style="display: none;">确认</button>
                            <button id="redraw-roi-focus-btn" class="roi-button" style="display: none;">重绘</button>
                            <button id="clear-roi-focus-btn" class="roi-button danger-button" style="display: none;">清除</button>
                            <button id="toggle-focus-roi-visibility-btn" class="roi-button mini-button" title="隐藏对焦ROI" style="display: none;"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 自动对焦参数设置 -->
                <div class="focus-range-controls">
                    <h5>对焦参数设置</h5>
                    <div class="focus-param-row">
                        <label>起始位置 (mm):</label>
                        <input type="number" id="focus-start-z" value="10" min="0" step="0.5">
                    </div>
                    <div class="focus-param-row">
                        <label>结束位置 (mm):</label>
                        <input type="number" id="focus-end-z" value="40" min="0" step="0.5">
                    </div>
                    <div class="focus-param-row">
                        <label>粗调步进 (mm):</label>
                        <input type="number" id="focus-coarse-step" value="5" min="0.1" step="0.1">
                    </div>
                    <div class="focus-param-row">
                        <label>精调步进 (mm):</label>
                        <input type="number" id="focus-fine-step" value="1" min="0.01" step="0.01">
                    </div>
                </div>

                <div class="control-item focus-controls">
                    <label>对焦操作:</label>
                    <div>
                        <button id="start-focus-btn" class="primary-button"><i class="fas fa-crosshairs"></i> 开始自动对焦</button>
                        <button id="stop-focus-btn" class="danger-button"><i class="fas fa-stop-circle"></i> 停止</button>
                    </div>
                </div>
             </div>

                <!-- Moved Camera Connection & Axis Section Here -->
                <div class="panel-section requires-connection">
                     <!-- Removed camera select/connect -->
                     <div class="control-item"> <!-- Standard layout for axis config -->
                         <label>Z轴配置:</label>
                         <div class="axis-config-row button-row">
                             <button id="config-axis-btn" class="select-button" title="配置相机Z轴">配置轴</button>
                             <button id="clear-axis-btn" class="select-button danger-button" title="清空已选Z轴">清除</button>
                         </div>
                     </div>
                     <div id="axis-config-dropdown" class="axis-dropdown">
                         <div class="axis-dropdown-header">选择 Z 轴 (模拟PLC数据)</div>
                         <ul id="axis-list" class="axis-list">
                             <li class="axis-list-loading">加载中...</li>
                         </ul>
                         <div class="axis-dropdown-footer">
                             <!-- Removed camera SN span -->
                         </div>
                     </div>
                </div>
                <!-- End Moved Section -->

                <hr class="separator">

                <!-- Calibration Controls -->
                <h4>当量计算</h4>
                 <div class="control-item">
                     <label for="calib-square-size">方格尺寸(mm):</label>
                     <input type="number" id="calib-square-size" value="1.0" step="0.1" min="0.1">
                 </div>
                  <div class="control-item">
                     <label>计算结果:</label>
                     <span id="calibration-result-value">-- px/mm</span>
                  </div>

                  <div class="roi-header-line control-item"> <!-- Treat header as control item -->
                     <label>校准ROI区域</label> <!-- Use label for consistency -->
                     <div> <!-- Group buttons -->
                         <button id="draw-roi-calib-btn" class="roi-button" style="display: none;"><i class="fas fa-pencil-alt"></i> 启用校准ROI</button>
                         <div id="calib-roi-button-group" class="roi-button-group" style="display: none;">
                            <button id="confirm-roi-calib-btn" class="roi-button" style="display: none;">确认</button>
                            <button id="redraw-roi-calib-btn" class="roi-button" style="display: none;">重绘</button>
                            <button id="clear-roi-calib-btn" class="roi-button danger-button" style="display: none;">清除</button>
                            <button id="toggle-calib-roi-visibility-btn" class="roi-button mini-button" title="切换校准ROI可见性" style="display: none;"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                </div>

                 <div class="control-item calibration-buttons">
                     <label>标定操作:</label>
                     <div>
                         <button id="calibrate-btn"><i class="fas fa-ruler-combined"></i> 执行计算</button>
                      </div>
                 </div>
         </aside>

        <footer class="status-bar">
            <span id="footer-status">状态: 未连接</span>
            <span>帧率: -- FPS</span>
            <span>鼠标: (<span id="mouse-coords">---, ---</span>)</span>
            <span>Z轴: <span id="footer-z-pos">--</span> mm</span>
            <span>图像: Pixmap(<span id="image-dims">---, ---</span>)</span>
            <span>缩放: 100%</span>
        </footer>

        <!-- 引入JavaScript脚本 -->
        <script type="module" src="src/js/main.js"></script>
    </div>
</body>
</html>
