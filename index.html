<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相机控制系统 - 完整流程模拟</title>
    <!-- Font Awesome 6.0.0 - Ensure integrity and crossorigin attributes are present -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-controls">
                <button class="header-button" id="btn-play" title="连续采集" disabled><i class="fas fa-play"></i></button>
                <button class="header-button" id="btn-stop" title="停止采集" disabled><i class="fas fa-stop"></i></button>
                <button class="header-button" id="btn-capture" title="单张拍照" disabled><i class="fas fa-camera"></i></button>
                <button class="header-button" id="btn-record" title="开始录制" disabled><i class="fas fa-video"></i></button>
                <button class="header-button" id="btn-trigger" title="软件触发" disabled><i class="fas fa-bolt"></i></button>
                <button class="header-button" id="btn-settings" title="设置"><i class="fas fa-cog"></i></button>
            </div>
            <div class="header-title">相机操作</div>
        </header>

        <main class="main-content">
            <section class="camera-view">
                <!-- Axis Configuration Panel -->
                <div class="axis-config-panel">
                    <div class="axis-group">
                        <div class="axis-item">
                            <label>X:</label>
                            <input type="number" id="x-axis" disabled>
                            <div class="axis-controls">
                                <button class="jog-btn minus" data-axis="X">-</button>
                                <select class="step-select" data-axis="X">
                                    <option value="0.001">0.001</option>
                                    <option value="0.01">0.01</option>
                                    <option value="0.1" selected>0.1</option>
                                    <option value="1.0">1.0</option>
                                    <option value="10.0">10.0</option>
                                </select>
                                <button class="jog-btn plus" data-axis="X">+</button>
                                <button class="config-button" data-axis="X" title="配置X轴"><i class="fas fa-cog"></i></button>
                            </div>
                        </div>
                        <div class="axis-item">
                            <label>Y:</label>
                            <input type="number" id="y-axis" disabled>
                            <div class="axis-controls">
                                <button class="jog-btn minus" data-axis="Y">-</button>
                                <select class="step-select" data-axis="Y">
                                    <option value="0.001">0.001</option>
                                    <option value="0.01">0.01</option>
                                    <option value="0.1" selected>0.1</option>
                                    <option value="1.0">1.0</option>
                                    <option value="10.0">10.0</option>
                                </select>
                                <button class="jog-btn plus" data-axis="Y">+</button>
                                <button class="config-button" data-axis="Y" title="配置Y轴"><i class="fas fa-cog"></i></button>
                            </div>
                        </div>
                        <div class="axis-item">
                            <label>Z:</label>
                            <input type="number" id="z-axis" disabled>
                            <div class="axis-controls">
                                <button class="jog-btn minus" data-axis="Z">-</button>
                                <select class="step-select" data-axis="Z">
                                    <option value="0.001">0.001</option>
                                    <option value="0.01">0.01</option>
                                    <option value="0.1" selected>0.1</option>
                                    <option value="1.0">1.0</option>
                                    <option value="5.0">5.0</option>
                                </select>
                                <button class="jog-btn plus" data-axis="Z">+</button>
                                <button class="config-button" data-axis="Z" title="配置Z轴"><i class="fas fa-cog"></i></button>
                            </div>
                        </div>
                        <div class="axis-item">
                            <label>U:</label>
                            <input type="number" id="u-axis" disabled>
                            <div class="axis-controls">
                                <button class="jog-btn minus" data-axis="U">-</button>
                                <select class="step-select" data-axis="U">
                                    <option value="0.1">0.1</option>
                                    <option value="1.0" selected>1.0</option>
                                    <option value="5.0">5.0</option>
                                    <option value="15.0">15.0</option>
                                    <option value="45.0">45.0</option>
                                </select>
                                <button class="jog-btn plus" data-axis="U">+</button>
                                <button class="config-button" data-axis="U" title="配置U轴"><i class="fas fa-cog"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Moved Toggle Button Here -->
                <button id="toggle-view-btn" class="select-button"><i class="fas fa-sync-alt"></i> 显示标定板</button>

                <!-- Container for image/svg -->
                <div id="camera-display-container">
                    <img id="simulated-image" src="favicon.png" alt="模拟相机图像">
                    <div id="calibration-pattern-display" style="display: none; width: 100%; height: 100%;">
                        <!-- SVG will be injected here by JS -->
                    </div>
                    <!-- Focus ROI Overlay (Original) -->
                    <div class="focus-overlay" id="focus-roi-overlay" style="display: none;"></div>
                    <!-- Calibration ROI Overlay (New) -->
                    <div class="focus-overlay calibration-roi-overlay" id="calibration-roi-overlay" style="display: none;"></div>
                    
                    <!-- 新增ROI工具面板 -->
                    <div id="roi-tools-panel" class="roi-tools-panel">
                        <div class="roi-tools-header">
                            <h5>ROI工具</h5>
                            <button class="close-button" id="close-roi-tools">×</button>
                        </div>
                        <div class="roi-tools-content">
                            <div class="roi-shape-tools">
                                <button class="roi-tool-button active" id="rect-roi-tool" title="矩形工具">矩形</button>
                                <button class="roi-tool-button" id="polygon-roi-tool" title="多边形工具">多边形</button>
                                <button class="roi-tool-button" id="ellipse-roi-tool" title="椭圆工具">椭圆</button>
                            </div>
                            <div class="roi-draw-mode-group">
                                <div class="radio-button-container active" id="draw-mode-container">
                                    <div class="radio-circle"></div>
                                    <label>绘画</label>
                                </div>
                                <div class="radio-button-container" id="edit-mode-container">
                                    <div class="radio-circle"></div>
                                    <label>编辑</label>
                                </div>
                            </div>
                            <div class="roi-option-group">
                                <button class="roi-tool-button" id="confirm-roi-tool-btn" title="确认">确认</button>
                                <button class="roi-tool-button" id="cancel-roi-tool-btn" title="取消">取消</button>
                                <button class="roi-tool-button" id="toggle-visibility-roi-btn" title="显示/隐藏">显示</button>
                                <button class="roi-tool-button" id="delete-roi-btn" title="删除">删除</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 标定点位阵显示 -->
                    <div id="calibration-matrix-display" class="calibration-matrix-display">
                        <div id="matrix-grid" class="matrix-grid"></div>
                    </div>
                </div>
            </section>

            <aside class="control-panel" id="control-panel-content">
                <!-- Camera Connection & Axis -->
                <div class="panel-section requires-connection">
                    <label for="serial-number">相机序列号：</label>
                    <div class="input-group">
                        <input type="text" id="serial-number" value="SN_Sim_1" readonly>
                        <button id="connect-btn" class="connect-button">连接</button>
                    </div>
                </div>

                <!-- Camera Info -->
                <div class="panel-section requires-connection">
                    <div class="control-item">
                        <label for="config-file">配置文件：</label>
                        <div class="input-group">
                            <input type="text" id="config-file" value="" readonly placeholder="未选择文件" disabled>
                            <button id="select-config-btn" class="select-button mini-button" disabled>
                                <i class="fas fa-folder-open"></i> 选择
                            </button>
                        </div>
                        <p class="small-description">相机配置文件路径 (.cfg)</p>
                    </div>
                    <div class="control-item">
                        <label for="save-path">图像保存路径：</label>
                        <div class="input-group">
                            <input type="text" id="save-path" value="" readonly placeholder="未选择路径" disabled>
                            <button id="select-folder-btn" class="select-button mini-button" disabled>
                                <i class="fas fa-folder"></i> 选择
                            </button>
                        </div>
                        <p class="small-description">图像和视频的保存目录</p>
                    </div>
                    <div class="camera-info-grid">
                        <div class="control-item">
                            <label for="camera-name">相机名称：</label>
                            <input type="text" id="camera-name" value="" disabled="">
                        </div>
                        <div class="control-item">
                            <label for="camera-model">相机型号：</label>
                            <input type="text" id="camera-model" value="" readonly="" disabled="">
                        </div>
                    </div>
                </div>

                <!-- Camera Properties & Controls -->
                <div class="panel-section requires-connection">
                    <h3>相机属性与控制</h3>

                    <div class="property-grid">
                        <!-- Simulated Properties -->
                        <div class="control-item">
                            <label>Y反转:</label>
                            <select class="compact-select" disabled=""><option>否</option><option>是</option></select>
                        </div>
                        <div class="control-item">
                            <label>X反转:</label>
                            <select class="compact-select" disabled=""><option>否</option><option>是</option></select>
                        </div>
                         <div class="control-item">
                            <label>触发模式:</label>
                            <select id="trigger-mode-select" disabled=""><option value="连续采集">连续采集</option><option value="软件触发">软件触发</option><option>外部触发</option></select>
                        </div>
                         <div class="control-item">
                            <label>触发信号:</label>
                            <select disabled=""><option>上升沿</option><option>下降沿</option></select>
                        </div>
                         <div class="control-item">
                            <label>触发源:</label>
                            <select disabled=""><option>通道0</option><option>通道1</option><option>软件</option></select>
                        </div>
                         <div class="control-item">
                            <label>图像格式:</label>
                            <select disabled=""><option>MONO8</option><option>RGB8</option></select>
                        </div>
                         <div class="control-item">
                            <label for="exposure-time">曝光时间(us):</label>
                            <input type="number" id="exposure-time" value="-1" disabled="">
                        </div>
                        <div class="control-item">
                            <label for="gain">增益:</label>
                            <input type="number" id="gain" value="-1" disabled="">
                        </div>
                        <div class="control-item toggle-item">
                            <label for="enable-camera-cb">使能:</label>
                            <label class="switch">
                                <input type="checkbox" id="enable-camera-cb" disabled="">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="control-item toggle-item">
                            <label for="white-balance-cb">自动白平衡:</label>
                             <label class="switch">
                                <input type="checkbox" id="white-balance-cb" disabled="">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <!-- Re-added Red, Green, Blue Range Sliders -->
                        <div class="control-item range-item manual-wb-control" style="display: flex;">
                            <label>红(R):</label>
                            <input type="range" id="wb-red" disabled="" min="0" max="255" value="128">
                            <span class="range-value">(128)</span>
                        </div>
                        <div class="control-item range-item manual-wb-control" style="display: flex;">
                            <label>绿(G):</label>
                            <input type="range" id="wb-green" disabled="" min="0" max="255" value="128">
                            <span class="range-value">(128)</span>
                        </div>
                        <div class="control-item range-item manual-wb-control" style="display: flex;">
                            <label>蓝(B):</label>
                            <input type="range" id="wb-blue" disabled="" min="0" max="255" value="128">
                            <span class="range-value">(128)</span>
                        </div>
                    </div>

                    <hr class="separator">

                    <!-- Z Axis / Focus -->
                    <h4>Z轴控制 / 对焦</h4>
                    <!-- 添加轴选择下拉列表 -->
                    <div class="control-item side-by-side">
                        <label for="focus-axis-select">选择轴:</label>
                        <select id="focus-axis-select" class="compact-select"></select>
                    </div>
                    
                    <!-- 当前轴位置显示和点动控制 -->
                    <div class="control-item side-by-side">
                        <label for="focus-axis-position">轴位置控制:</label>
                        <div class="axis-position-control">
                            <button class="jog-btn minus" id="focus-jog-minus">-</button>
                            <input type="text" id="focus-axis-position" value="0" readonly>
                            <button class="jog-btn plus" id="focus-jog-plus">+</button>
                        </div>
                    </div>
                    
                    <!-- 新增步进控制下拉列表 -->
                    <div class="control-item side-by-side">
                        <label for="focus-step-select">步进量:</label>
                        <select id="focus-step-select" class="compact-select">
                            <option value="1">1</option>
                            <option value="10">10</option>
                            <option value="100" selected>100</option>
                            <option value="500">500</option>
                            <option value="1000">1000</option>
                        </select>
                    </div>
                    
                    <!-- 对焦相关数据显示 -->
                     <div class="control-item side-by-side">
                        <label for="clarity-value">当前清晰度:</label>
                        <input type="text" id="clarity-value" value="--" readonly disabled="">
                    </div>
                    
                    <!-- 修改为搜索范围和搜索颗粒度 -->
                    <div class="control-item side-by-side">
                        <label for="focus-range">搜索范围:</label>
                        <div class="input-group">
                            <input type="number" id="focus-range" value="5000" step="100" min="100" class="compact-input">
                        </div>
                    </div>
                    <div class="control-item side-by-side">
                        <label for="focus-step">搜索颗粒度:</label>
                        <div class="input-group">
                            <input type="number" id="focus-step" value="500" step="10" min="1" class="compact-input">
                        </div>
                    </div>

                    <!-- Focus ROI Controls (Moved Here) -->
                    <div class="roi-header-line">
                        <h4 class="roi-heading">对焦ROI区域</h4>
                        <!-- Draw button now IN the header line -->
                        <button id="draw-roi-focus-btn" class="roi-button">
                            <i class="fas fa-pencil-alt"></i> 绘制
                        </button>
                        <div id="focus-roi-button-group" class="roi-button-group">
                            <button id="confirm-roi-focus-btn" class="roi-button">确认</button>
                            <button id="redraw-roi-focus-btn" class="roi-button">重绘</button>
                            <button id="clear-roi-focus-btn" class="roi-button danger-button">清除</button>
                            <button id="toggle-focus-roi-visibility-btn" class="roi-button mini-button" title="切换对焦ROI可见性">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="control-item focus-controls">
                        <button id="start-focus-btn" class="primary-button">
                            <i class="fas fa-crosshairs"></i> 开始自动对焦
                        </button>
                        <button id="stop-focus-btn" class="danger-button">
                            <i class="fas fa-stop-circle"></i> 停止
                        </button>
                    </div>

                    <hr class="separator">

                    <!-- 相机标定模块 - 简化版 -->
                    <h4 class="section-title"><i class="fas fa-camera-retro"></i> 相机标定</h4>
                    
                    <!-- 标定参数配置区域 -->
                    <div class="control-group">
                        <div class="control-item side-by-side">
                            <label for="matrix-size">矩阵大小:</label>
                            <select id="matrix-size" class="compact-select">
                                <option value="3" selected>3×3</option>
                                <option value="5">5×5</option>
                                <option value="7">7×7</option>
                                <option value="9">9×9</option>
                            </select>
                        </div>
                        <div class="control-item side-by-side">
                            <label for="point-offset">点位偏移(mm):</label>
                            <input type="number" id="point-offset" value="10.0" step="0.1" min="0.1">
                        </div>
                        <div class="control-item side-by-side">
                            <label for="mark-size">Mark点尺寸(mm):</label>
                            <input type="number" id="mark-size" value="2.0" step="0.1" min="0.1">
                        </div>
                    </div>
                    
                    <!-- 标定操作按钮区域 -->
                    <div class="calibration-buttons-group">
                        <button id="detect-mark-btn" class="primary-button">
                            <i class="fas fa-crosshairs"></i> 检测Mark点
                        </button>
                        <button id="center-mark-btn" class="primary-button" disabled>
                            <i class="fas fa-compress-arrows-alt"></i> 居中Mark点
                        </button>
                        <button id="start-calib-btn" class="primary-button" disabled>
                            <i class="fas fa-play-circle"></i> 开始标定
                        </button>
                        <button id="stop-calib-btn" class="danger-button" disabled>
                            <i class="fas fa-stop-circle"></i> 停止标定
                        </button>
                    </div>
                    
                    <!-- 标定进度与状态区域 -->
                    <div class="status-container">
                        <div class="status-row">
                            <label>标定状态:</label>
                            <span id="calibration-status" class="status-chip">未开始</span>
                        </div>
                        <div class="status-row">
                            <label>当前点位:</label>
                            <span id="current-point" class="status-chip">--</span>
                        </div>
                        <div class="progress-row">
                            <label>进度:</label>
                            <div class="progress-bar">
                                <div id="calibration-progress" class="progress" style="width: 0%">0%</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 结果操作按钮 -->
                    <div class="result-actions-row">
                        <button id="export-matrix-btn" class="secondary-button" disabled>
                            <i class="fas fa-file-export"></i> 导出矩阵
                        </button>
                        <button id="view-results-btn" class="secondary-button" disabled>
                            <i class="fas fa-search"></i> 查看详细结果
                        </button>
                    </div>

                    <hr class="separator">

                    <!-- 当量计算 -->
                    <h4>当量计算</h4>
                     <!-- Apply side-by-side layout -->
                     <div class="control-item side-by-side">
                         <label for="calib-square-size">方格尺寸(mm):</label>
                         <input type="number" id="calib-square-size" value="1.0" step="0.1" min="0.1">
                     </div>
                      <!-- Apply side-by-side layout -->
                      <div class="control-item side-by-side">
                         <label>计算结果:</label>
                         <span id="calibration-result-value">-- px/mm</span>
                      </div>
                      
                      <!-- 当量校准按钮 -->
                      <div class="control-item">
                          <button id="debug-calib-btn" class="primary-button"><i class="fas fa-ruler-combined"></i> 当量校准</button>
                      </div>
                  </div>
             </aside>
        </main>

        <footer class="status-bar">
            <span id="footer-status">状态: 未连接</span>
            <span>帧率: -- FPS</span>
            <span>鼠标: (<span id="mouse-coords">---, ---</span>)</span>
            <span>Z轴: <span id="footer-z-pos">--</span> mm</span>
            <span>图像: Pixmap(<span id="image-dims">---, ---</span>)</span>
            <span>缩放: 100%</span>
        </footer>

        <script src="script.js"></script>
    </div>

    <!-- 轴配置弹窗 -->
    <div id="axis-config-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>轴配置</h3>
                <button class="close-button">&times;</button>
            </div>
            <div class="modal-body">
                <div class="config-section">
                    <div class="control-item">
                        <label for="axis-select">选择轴：</label>
                        <select id="axis-select">
                            <!-- 轴选项将由JavaScript根据PLC回传的轴数据动态填充 -->
                        </select>
                    </div>
                    <div class="control-item">
                        <label for="encoder-value">编码器值：</label>
                        <input type="number" id="encoder-value" readonly>
                    </div>
                    <div class="control-item">
                        <label for="axis-ratio">轴当量(mm/p)：</label>
                        <input type="number" id="axis-ratio" step="0.0001" min="0">
                    </div>
                    <div class="control-item">
                        <label for="axis-backlash">反向间隙(mm)：</label>
                        <input type="number" id="axis-backlash" step="0.001" min="0">
                    </div>
                    <div class="control-item">
                        <label for="axis-speed">运动速度(mm/s)：</label>
                        <input type="number" id="axis-speed" step="0.1" min="0">
                    </div>
                    <div class="control-item">
                        <label for="axis-acc">加速度(mm/s²)：</label>
                        <input type="number" id="axis-acc" step="0.1" min="0">
                    </div>
                    <div class="control-item">
                        <label for="soft-limit-min">软限位最小值(mm)：</label>
                        <input type="number" id="soft-limit-min">
                    </div>
                    <div class="control-item">
                        <label for="soft-limit-max">软限位最大值(mm)：</label>
                        <input type="number" id="soft-limit-max">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-axis-config" class="primary-button">保存配置</button>
                <button id="cancel-axis-config" class="danger-button">取消</button>
            </div>
        </div>
    </div>
</body>
</html>
