<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相机控制系统 - 完整流程模拟</title>
    <!-- Font Awesome 6.0.0 - Ensure integrity and crossorigin attributes are present -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-controls">
                <button class="header-button" id="btn-play" title="连续采集" disabled><i class="fas fa-play"></i></button>
                <button class="header-button" id="btn-stop" title="停止采集" disabled><i class="fas fa-stop"></i></button>
                <button class="header-button" id="btn-capture" title="单张拍照" disabled><i class="fas fa-camera"></i></button>
                <button class="header-button" id="btn-record" title="开始录制" disabled><i class="fas fa-video"></i></button>
                <button class="header-button" id="btn-trigger" title="软件触发" disabled><i class="fas fa-bolt"></i></button>
                <button class="header-button" id="btn-settings" title="设置"><i class="fas fa-cog"></i></button>
            </div>
            <div class="header-title">相机操作</div>
        </header>

        <main class="main-content">
            <section class="camera-view">
                <!-- Moved Toggle Button Here -->
                <button id="toggle-view-btn" class="select-button" disabled="" style="position: absolute; z-index: 10;"><i class="fas fa-sync-alt"></i> 显示标定板</button>

                <!-- Container for image/svg -->
                <div id="camera-display-container">
                    <img id="simulated-image" src="favicon.png" alt="模拟相机图像">
                    <div id="calibration-pattern-display" style="display: none; width: 100%; height: 100%;">
                        <!-- SVG will be injected here by JS -->
                    </div>
                    <!-- Focus ROI Overlay (Original) -->
                    <div class="focus-overlay" id="focus-roi-overlay" style="display: none;"></div>
                    <!-- Calibration ROI Overlay (New) -->
                    <div class="focus-overlay calibration-roi-overlay" id="calibration-roi-overlay" style="display: none;"></div>
                </div>
            </section>

            <aside class="control-panel" id="control-panel-content">
                <!-- Camera Connection & Axis -->
                <div class="panel-section requires-connection">
                    <label for="serial-number">相机序列号：</label>
                     <div class="input-group axis-config-group">
                         <div class="axis-config-row">
                             <select id="serial-number" disabled><option>加载相机...</option></select>
                             <button id="connect-btn" class="connect-button" disabled>连接</button>
                         </div>
                         <div class="axis-config-row button-row">
                             <button id="config-axis-btn" class="select-button" title="配置相机Z轴" disabled>配置轴</button>
                             <button id="clear-axis-btn" class="select-button danger-button" title="清空已选Z轴" disabled>清除</button>
                         </div>
                    </div>
                    <div id="axis-config-dropdown" class="axis-dropdown" >
                         <div class="axis-dropdown-header">选择 Z 轴 (模拟PLC数据)</div>
                         <ul id="axis-list" class="axis-list">
                             <li class="axis-list-loading">加载中...</li>
                         </ul>
                         <div class="axis-dropdown-footer">
                             <span id="dropdown-camera-sn"></span>
                         </div>
                    </div>
                </div>

                <!-- Camera Info -->
                <div class="panel-section requires-connection">
                    <div class="control-item">
                        <label for="config-file">配置文件：</label>
                         <div class="input-group">
                            <input type="text" id="config-file" value="" readonly placeholder="未选择文件" disabled="">
                            <button id="select-config-btn" class="select-button mini-button" disabled="">选择</button>
                        </div>
                    </div>
                     <div class="control-item">
                        <label for="save-path">图像保存路径：</label>
                         <div class="input-group">
                            <input type="text" id="save-path" value="" readonly placeholder="连接后显示" disabled="">
                            <button id="select-folder-btn" class="select-button mini-button" disabled="">选择</button>
                        </div>
                    </div>
                    <div class="camera-info-grid">
                        <div class="control-item">
                            <label for="camera-name">相机名称：</label>
                            <input type="text" id="camera-name" value="" disabled="">
                        </div>
                        <div class="control-item">
                            <label for="camera-model">相机型号：</label>
                            <input type="text" id="camera-model" value="" readonly="" disabled="">
                        </div>
                    </div>
                </div>

                <!-- Camera Properties & Controls -->
                <div class="panel-section requires-connection">
                    <h3>相机属性与控制</h3>

                    <div class="property-grid">
                        <!-- Simulated Properties -->
                        <div class="control-item">
                            <label>Y反转:</label>
                            <select class="compact-select" disabled=""><option>否</option><option>是</option></select>
                        </div>
                        <div class="control-item">
                            <label>X反转:</label>
                            <select class="compact-select" disabled=""><option>否</option><option>是</option></select>
                        </div>
                         <div class="control-item">
                            <label>触发模式:</label>
                            <select id="trigger-mode-select" disabled=""><option value="连续采集">连续采集</option><option value="软件触发">软件触发</option><option>外部触发</option></select>
                        </div>
                         <div class="control-item">
                            <label>触发信号:</label>
                            <select disabled=""><option>上升沿</option><option>下降沿</option></select>
                        </div>
                         <div class="control-item">
                            <label>触发源:</label>
                            <select disabled=""><option>通道0</option><option>通道1</option><option>软件</option></select>
                        </div>
                         <div class="control-item">
                            <label>图像格式:</label>
                            <select disabled=""><option>MONO8</option><option>RGB8</option></select>
                        </div>
                         <div class="control-item">
                            <label for="exposure-time">曝光时间(us):</label>
                            <input type="number" id="exposure-time" value="-1" disabled="">
                        </div>
                        <div class="control-item">
                            <label for="gain">增益:</label>
                            <input type="number" id="gain" value="-1" disabled="">
                        </div>
                        <div class="control-item toggle-item">
                            <label for="enable-camera-cb">使能:</label>
                            <label class="switch">
                                <input type="checkbox" id="enable-camera-cb" disabled="">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="control-item toggle-item">
                            <label for="white-balance-cb">自动白平衡:</label>
                             <label class="switch">
                                <input type="checkbox" id="white-balance-cb" disabled="">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <!-- Re-added Red, Green, Blue Range Sliders -->
                        <div class="control-item range-item manual-wb-control" style="display: flex;">
                            <label>红(R):</label>
                            <input type="range" id="wb-red" disabled="" min="0" max="255" value="128">
                            <span class="range-value">(128)</span>
                        </div>
                        <div class="control-item range-item manual-wb-control" style="display: flex;">
                            <label>绿(G):</label>
                            <input type="range" id="wb-green" disabled="" min="0" max="255" value="128">
                            <span class="range-value">(128)</span>
                        </div>
                        <div class="control-item range-item manual-wb-control" style="display: flex;">
                            <label>蓝(B):</label>
                            <input type="range" id="wb-blue" disabled="" min="0" max="255" value="128">
                            <span class="range-value">(128)</span>
                        </div>
                    </div>

                    <hr class="separator">

                    <!-- Z Axis / Focus -->
                    <h4>Z轴控制 / 对焦</h4>
                    <!-- Apply side-by-side layout -->
                    <div class="control-item side-by-side">
                        <label for="current-z">当前 Z (mm):</label>
                        <input type="text" id="current-z" value="--" readonly disabled="">
                    </div>
                     <!-- Apply side-by-side layout -->
                     <div class="control-item side-by-side">
                        <label for="clarity-value">当前清晰度:</label>
                        <input type="text" id="clarity-value" value="--" readonly disabled="">
                    </div>
                     <!-- Apply side-by-side layout -->
                     <div class="control-item focus-status side-by-side">
                        <label>对焦状态:</label>
                        <span id="focus-status-text" class="status-未连接">未连接</span>
                    </div>

                    <!-- Focus ROI Controls (Moved Here) -->
                    <div class="roi-header-line">
                        <h4 class="roi-heading">对焦ROI区域</h4>
                        <!-- Draw button now IN the header line -->
                        <button id="draw-roi-focus-btn" class="roi-button" style="display: flex;" disabled=""><i class="fas fa-pencil-alt"></i> 绘制</button>
                        <div id="focus-roi-button-group" class="roi-button-group control-item" style="display: none;">
                            <button id="confirm-roi-focus-btn" class="roi-button" style="display: none;" disabled="">确认</button>
                            <button id="redraw-roi-focus-btn" class="roi-button" style="display: none;" disabled="">重绘</button>
                            <button id="clear-roi-focus-btn" class="roi-button danger-button" style="display: none;" disabled="">清除</button>
                            <button id="toggle-focus-roi-visibility-btn" class="roi-button mini-button" disabled="" title="切换对焦ROI可见性" style="display: none;"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>

                    <div class="control-item focus-controls">
                        <button id="start-focus-btn" class="primary-button" disabled=""><i class="fas fa-crosshairs"></i> 开始自动对焦</button>
                        <button id="stop-focus-btn" class="danger-button" disabled=""><i class="fas fa-stop-circle"></i> 停止</button>
                    </div>

                    <hr class="separator">

                    <!-- Calibration Controls -->
                    <h4>当量计算</h4>
                     <!-- Apply side-by-side layout -->
                     <div class="control-item side-by-side">
                         <label for="calib-square-size">方格尺寸(mm):</label>
                         <input type="number" id="calib-square-size" value="1.0" step="0.1" min="0.1" disabled="">
                     </div>
                      <!-- Apply side-by-side layout -->
                      <div class="control-item side-by-side">
                         <label>计算结果:</label>
                         <span id="calibration-result-value">-- px/mm</span>
                      </div>

                      <!-- Calibration ROI Controls (Moved Here) -->
                      <div class="roi-header-line">
                         <h4 class="roi-heading">校准ROI区域</h4>
                         <!-- Enable/Draw button now IN the header line -->
                         <button id="draw-roi-calib-btn" class="roi-button" style="display: none;" disabled=""><i class="fas fa-pencil-alt"></i> 启用校准ROI</button>
                         <div class="roi-button-group control-item">
                            <button id="confirm-roi-calib-btn" class="roi-button" style="display: none;" disabled="">确认</button>
                            <button id="redraw-roi-calib-btn" class="roi-button" style="display: none;" disabled="">重绘</button>
                            <button id="toggle-calib-roi-visibility-btn" class="roi-button mini-button" disabled="" title="切换校准ROI可见性" style="display: none;"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>

                     <div class="control-item calibration-buttons">
                          <button id="calibrate-btn" disabled=""><i class="fas fa-ruler-combined"></i> 执行计算</button>
                     </div>
                  </div>
             </aside>
        </main>

        <footer class="status-bar">
            <span id="footer-status">状态: 未连接</span>
            <span>帧率: -- FPS</span>
            <span>鼠标: (<span id="mouse-coords">---, ---</span>)</span>
            <span>Z轴: <span id="footer-z-pos">--</span> mm</span>
            <span>图像: Pixmap(<span id="image-dims">---, ---</span>)</span>
            <span>缩放: 100%</span>
        </footer>

        <script src="script.js"></script>
    </div>
</body>
</html>
