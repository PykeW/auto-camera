<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相机控制系统 - 完整流程模拟</title>
    <!-- Font Awesome 6.0.0 - Ensure integrity and crossorigin attributes are present -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-controls">
                <button class="header-button" id="btn-play" title="连续采集" disabled><i class="fas fa-play"></i></button>
                <button class="header-button" id="btn-stop" title="停止采集" disabled><i class="fas fa-stop"></i></button>
                <button class="header-button" id="btn-capture" title="单张拍照" disabled><i class="fas fa-camera"></i></button>
                <button class="header-button" id="btn-record" title="开始录制" disabled><i class="fas fa-video"></i></button>
                <button class="header-button" id="btn-trigger" title="软件触发" disabled><i class="fas fa-bolt"></i></button>
                <button class="header-button" id="btn-settings" title="设置"><i class="fas fa-cog"></i></button>
            </div>
            <div class="header-title">相机操作</div>
        </header>

        <main class="main-content">
            <section class="camera-view">
                <img id="simulated-image" src="favicon.png" alt="模拟相机图像">
                <div class="focus-overlay" id="focus-roi-overlay" style="display: none;"></div>
                
                <!-- 轴配置面板 -->
                <div class="axis-config-panel">
                    <div class="axis-config-header">
                        <h3>轴配置</h3>
                        <button id="add-axis-btn" class="add-button" title="添加新轴"><i class="fas fa-plus"></i></button>
                    </div>
                    
                    <!-- 常规轴列表 -->
                    <div class="axis-list" id="axis-list">
                        <!-- 轴列表将由JS填充 -->
                    </div>
                </div>
            </section>

            <aside class="control-panel" id="control-panel-content">
                <div class="panel-section requires-connection">
                    <label for="serial-number">相机序列号：</label>
                     <div class="input-group">
                        <select id="serial-number" disabled><option>请连接...</option></select>
                        <button id="connect-btn" class="connect-button">连接</button>
                    </div>
                </div>

                <div class="panel-section requires-connection">
                    <label for="config-file">配置文件：</label>
                     <div class="input-group">
                        <input type="text" id="config-file" value="" readonly placeholder="未选择文件">
                        <button id="select-config-btn" class="select-button" disabled>选择文件</button>
                    </div>
                </div>

                <div class="panel-section requires-connection">
                    <label for="save-path">图像保存路径：</label>
                     <div class="input-group">
                        <input type="text" id="save-path" value="" readonly placeholder="连接后显示">
                        <button id="select-folder-btn" class="select-button" disabled>选择文件夹</button>
                    </div>
                </div>

                <div class="panel-section requires-connection">
                    <label for="camera-name">相机名称：</label>
                    <input type="text" id="camera-name" value="" disabled>
                </div>

                <div class="panel-section requires-connection">
                    <label for="camera-model">相机型号：</label>
                    <input type="text" id="camera-model" value="" readonly disabled>
                </div>

                <div class="panel-section requires-connection">
                    <h3>相机属性</h3>
                    <table class="property-table" id="property-table">
                        <tbody>
                            <!-- Rows will be populated by JS, inputs/selects should be disabled initially -->
                        </tbody>
                    </table>
                </div>

                 <div class="panel-section requires-connection">
                    <h3>Z轴控制 / 对焦</h3>
                    <div class="control-item">
                        <label for="axis-select">选择Z轴:</label>
                        <select id="axis-select" disabled>
                            <option value="">--请选择--</option>
                        </select>
                    </div>
                    
                    <!-- 轴信息区域 -->
                    <div class="control-item axis-info">
                        <label>轴范围 (mm):</label>
                        <div class="input-group">
                            <label style="width:30px">起点</label>
                            <input type="number" id="axis-min" value="0" min="0" max="1000" step="0.1" style="flex-grow:1" disabled>
                            <label style="width:30px">终点</label>
                            <input type="number" id="axis-max" value="100" min="0" max="1000" step="0.1" style="flex-grow:1" disabled>
                        </div>
                    </div>
                    
                    <div class="control-item">
                        <label for="current-z">当前 Z 位置 (mm):</label>
                        <input type="text" id="current-z" value="--" readonly disabled>
                    </div>
                    
                    <!-- 点动/寸动控制 -->
                    <div class="control-item">
                        <label>手动调整 Z 轴:</label>
                        <div class="jog-controls">
                            <button id="jog-down" class="jog-button" disabled><i class="fas fa-minus"></i></button>
                            <input type="number" id="jog-step" value="0.1" min="0.01" max="10" step="0.01" style="width:60px" disabled>
                            <button id="jog-up" class="jog-button" disabled><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                    
                    <div class="control-item">
                        <label for="clarity-value">当前清晰度:</label>
                        <input type="text" id="clarity-value" value="--" readonly disabled>
                    </div>
                    
                    <!-- 自动对焦参数设置 -->
                    <div class="control-item">
                        <label>自动对焦参数:</label>
                        <button id="toggle-focus-params" class="toggle-button" disabled>显示参数</button>
                        <div id="focus-params-container" class="hidden-section">
                            <div class="param-item">
                                <label for="focus-scan-range">扫描范围 (mm):</label>
                                <div class="input-group">
                                    <input type="number" id="focus-scan-min" value="5" min="0" max="100" step="0.5" style="flex-grow:1" disabled>
                                    <span>至</span>
                                    <input type="number" id="focus-scan-max" value="25" min="0" max="100" step="0.5" style="flex-grow:1" disabled>
                                </div>
                            </div>
                            <div class="param-item">
                                <label for="focus-step-rough">粗扫步长 (mm):</label>
                                <input type="number" id="focus-step-rough" value="1.0" min="0.1" max="5" step="0.1" disabled>
                            </div>
                            <div class="param-item">
                                <label for="focus-step-fine">精扫步长 (mm):</label>
                                <input type="number" id="focus-step-fine" value="0.1" min="0.01" max="1" step="0.01" disabled>
                            </div>
                        </div>
                    </div>
                    
                    <div class="control-item focus-controls">
                        <button id="start-focus-btn" class="primary-button" disabled><i class="fas fa-crosshairs"></i> 开始自动对焦</button>
                        <button id="stop-focus-btn" class="danger-button" disabled><i class="fas fa-stop-circle"></i> 停止</button>
                    </div>
                    <div class="control-item focus-status">
                        <label>对焦状态:</label>
                        <span id="focus-status-text" class="status-未连接">未连接</span>
                    </div>
                </div>
                <div class="panel-section requires-connection">
                    <h3>当量计算 (可选)</h3>
                    <div class="control-item">
                        <button id="calibrate-btn" disabled><i class="fas fa-ruler-combined"></i> 执行当量计算</button>
                        <p class="description">在最佳对焦位置后执行，用于计算像素/距离比。</p>
                    </div>
                </div>
                 <div class="panel-section requires-connection">
                    <h3>ROI区域</h3>
                     <div class="input-group">
                        <label style="width:30px">左X</label> <input type="number" value="--" style="flex-grow:1" disabled>
                        <label style="width:30px">上Y</label> <input type="number" value="--" style="flex-grow:1" disabled>
                    </div>
                     <div class="input-group" style="margin-top: var(--spacing-small)">
                        <label style="width:30px">右X</label> <input type="number" value="--" style="flex-grow:1" disabled>
                        <label style="width:30px">下Y</label> <input type="number" value="--" style="flex-grow:1" disabled>
                     </div>
                     <button id="enable-roi-btn" style="margin-top: var(--spacing-medium); width: 100%;" disabled>启用ROI</button>
                 </div>

            </aside>
        </main>

        <footer class="status-bar">
            <span id="footer-status">状态: 未连接</span>
            <span>帧率: -- FPS</span>
            <span>鼠标: (<span id="mouse-coords">---, ---</span>)</span>
            <span>Z轴: <span id="footer-z-pos">--</span> mm</span>
            <span>图像: Pixmap(<span id="image-dims">---, ---</span>)</span>
            <span>缩放: 100%</span>
        </footer>

        <!-- 添加轴弹窗 -->
        <div id="add-axis-modal" class="modal add-axis-modal">
          <div class="modal-overlay"></div>
          <div class="modal-content">
            <div class="modal-header">
              <h2>添加新轴</h2>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="new-axis-name">轴名称:</label>
                <input type="text" id="new-axis-name" placeholder="输入新轴名称">
              </div>
              <div class="form-group">
                <label for="new-axis-type">轴类型:</label>
                <select id="new-axis-type">
                  <option value="X">X轴</option>
                  <option value="Y">Y轴</option>
                  <option value="Z">Z轴</option>
                  <option value="R">R轴 (旋转)</option>
                </select>
              </div>
              <div class="form-group">
                <label for="new-axis-min">最小范围 (mm):</label>
                <input type="number" id="new-axis-min" value="0" min="0" max="1000" step="0.1">
              </div>
              <div class="form-group">
                <label for="new-axis-max">最大范围 (mm):</label>
                <input type="number" id="new-axis-max" value="100" min="0" max="1000" step="0.1">
              </div>
              <div class="form-group">
                <label for="new-axis-current">当前位置 (mm):</label>
                <input type="number" id="new-axis-current" value="10" min="0" max="1000" step="0.1">
              </div>
            </div>
            <div class="modal-footer">
              <button id="add-axis-cancel-btn">取消</button>
              <button id="add-axis-save-btn">添加</button>
            </div>
          </div>
        </div>

        <script src="script.js"></script>
    </div>
</body>
</html>
